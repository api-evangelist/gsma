source: https://developer.mobilemoneyapi.io/sdks/getting-started/introduction.html
note: >-
  The GSMA publishes five first-party client SDKs, all of them for the GSMA Mobile Money API
  specification 1.2.0, maintained in the github.com/gsmainclusivetechlab organisation (the GSMA
  Inclusive Tech Lab). The portal states: "The GSMA have provided 5 SDKs which enable developers
  using 5 of the most common client and server application languages used today to easily work with
  GSMA Mobile Money API Specification 1.2.0." None of the five is published to a public package
  registry — npm (mmapi-nodejs-sdk, mmapi-javascript-sdk), Packagist (gsma/mmp) and Maven Central
  (io.gsma / com.gsma / mmapi-java-sdk) all returned no listing on the probe date, and PyPI has no
  GSMA package. Installation is by cloning the repository or, for Java/Android, by consuming the
  jar/aar committed to the repo. There is no first-party SDK for the Open Gateway / CAMARA APIs:
  the GSMA publishes the specifications and leaves client tooling to operators, aggregators and the
  CAMARA project.
