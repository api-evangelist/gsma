note: >-
  The GSMA publishes a dated release cadence for neither programme in a single feed. The Mobile
  Money developer portal publishes a per-version Change List and Highlights page, captured below.
  The Open Gateway portal republishes CAMARA specifications and carries no changelog of its own —
  its release rhythm is the CAMARA meta-release, announced on camaraproject.org, and the per-spec
  version string (0.2.0, 0.6.1, 1.0.0, wip) is the only version signal the GSMA portal exposes.
