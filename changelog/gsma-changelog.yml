  entries:
  - version: 1.2.0
    date: null
    breaking:
    - Deprecated /transactions — marked for removal; use /transactions/type/{transactionType} instead.
    - Deprecated requestingLei and receivingLei fields — marked for removal in the next major release.
    additions:
    - Transaction Status Update — new PATCH endpoint for updating transaction status, for doubt resolution and two-stage transaction processing.
    - Bill Payment Without Bill Reference — two new POST endpoints allowing bill payment without a bill reference number.
    - Bill Payment Retrieval — new GET endpoints with query-parameter filtering and pagination response headers.
    - Multiple Authorisation Codes Retrieval — new GET endpoints with standard filtering including state-based filtering.
    - Mobile Money Customer Account Creation — new POST and GET endpoints for individual customer accounts.
    - Mobile Money Customer Account Modification — new PATCH endpoints for account status, substatus, identity status and KYC verification information.
    - Custom Data Array — key/value arrays across transactions, reversals, bills, mandates, quotations and accounts for provider-specific data.
    - Debit Mandate Identification — enhanced payee identification on debit mandate endpoints.
    - Consistent Date Fields — requestDate, creationDate and modificationDate added to batch transactions, bill payments and links.
    - Bills Retrieval Cursor Mechanism — standard pagination and filtering headers applied to bills endpoints.
    - Quotation Country Information — originCountry, receivingCountry and sendingServiceProviderCountry added.
    - Requesting Organisation field added to transactions, batch transactions, reversals, quotations, links, debit mandates and authorisation codes.
    - Authorisation Code Lifetime Validation — minimum value enforced for codeLifetime.
