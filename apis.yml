- aid: gsma:gsma-supporting-api
  name: GSMA Supporting API
  description: >-
    Supporting APIs consist of the following:


    - **Heartbeat API:** Used for monitoring purposes and establishes whether the system of an API provider
    is in a state that enables a client to submit a request for processing within established SLAs.

    - **Request State API** : Used to determine the state of an asynchronous request.

    - **Responses API** : In some circumstances, the client may not have received the final representation
    of the resource for which it attempted to create or update. The **Responses** API allows a client
    to identify and retrieve the final representation of the resource assuming that the resource was created.
  humanURL: https://developer.mobilemoneyapi.io/api-versions-1.2/
