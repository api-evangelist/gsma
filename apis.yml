- aid: gsma:gsma-authorisation-codes-api
  name: GSMA Authorisation Codes API
  description: >-
    The **Authorisation** Codes APIs allow a payer to generate a payment code which when presented to
    the payee, can be redeemed for an amount associated with the code.

    Authorisation codes can be set to expire. Note that expiry time can be specified via the API, however
    the mobile money provider

    may mandate a common expiry period for all codes.

    Authorisation Codes are used widely in the industry across a range of use cases, including:


    - ATM Codes for card-less withdrawals. A code is generated in advance by the customer and entered
    into the ATM to facilitate the withdrawal.

    - Pre-authorised codes for agent withdrawals. A code is generated in advance by the customer and given
    to the agent to facilitate the withdrawal.

    - Pre-authorised codes for merchant payments. The customer generates a code which can be redeemed
    at a merchant.
  humanURL: https://developer.mobilemoneyapi.io/api-versions-1.2/
  baseURL: https://sandbox.mobilemoneyapi.io/simulator/v1.2/passthrough/mm
