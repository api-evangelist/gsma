- aid: gsma:gsma-open-gateway-number-verification
  name: GSMA Open Gateway Number Verification API
  description: CAMARA Number Verification API as published on the GSMA Open Gateway developer portal.
    Silently verifies or retrieves the mobile number of the device making a request using network-based
    or SIM-based authentication, with single-use short-lived tokens and no refresh tokens. This is the
    most widely deployed Open Gateway API after SIM Swap. OpenAPI 3.0.3, version wip, 2 path(s) and 2
    operation(s); authorization is OpenID Connect (openIdConnect security scheme) with per-operation CAMARA
    scopes.
  humanURL: https://open-gateway.gsma.com/docs/number-verification
