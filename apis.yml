- aid: gsma:gsma-mobile-money-api
  name: GSMA Mobile Money API
  description: The GSMA Mobile Money API is a harmonised REST/JSON specification for mobile money platforms,
    developed by the GSMA with the mobile money industry and published openly at developer.mobilemoneyapi.io.
    Version 1.2.0 defines 53 paths across Transactions, Quotations, Accounts, Bills, Debit Mandates, Links,
    and Authorisation Codes, covering merchant payments, disbursements, international transfers, P2P transfers,
    recurring payments, account linking, bill payments, and agent cash-in/cash-out. The OpenAPI 3.0.0
    document is downloadable without registration; the simulator sandbox host referenced in the spec did
    not resolve in DNS on the review date.
