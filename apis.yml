- aid: gsma:gsma-debit-mandates-api
  name: GSMA Debit Mandates API
  description: >-
    The **Debit Mandates** APIs allow a mobile money customer to provide prior approval for payments to
    be taken from their account by

    a requesting payee. If the amount limit field is not supplied, the payee will be able to take any
    amount. Mandates can be open-ended

    or can be constrained by a quantified number of payments for a given frequency.


    Mandates can be created, viewed and modified. The request to create a debit mandate will be typically
    initiated by the

    service provider (payee) but can also be requested by the customer (payer).
  humanURL: https://developer.mobilemoneyapi.io/api-versions-1.2/
