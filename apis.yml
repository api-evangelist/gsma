- aid: gsma:gsma-quotations-api
  name: GSMA Quotations API
  description: >-
    The **Quotations** APIs are used to obtain one or multiple quotes for a mobile money customer who
    wishes to

    transfer money. The creation of a quote involves returning any fees that will be levied on the sending
    customer

    and if the request is international, the forex rate is returned. A request is made for a quotation
    by the requesting

    Service Provider in response to a customer request. The quotation is calculated and returned. If the
    customer is

    satisfied with the quotation, then they can confirm and proceed with a transaction request using the
    **/transactions** API.
  humanURL: https://developer.mobilemoneyapi.io/api-versions-1.2/
