url: https://raw.githubusercontent.com/api-evangelist/gsma/refs/heads/main/apis.yml
name: GSMA
kind: company
description: 'The GSMA (GSM Association) is the London-headquartered global trade body for the mobile industry,
  representing roughly 750 mobile network operators and around 400 companies in the wider mobile ecosystem,
  and the organiser of MWC Barcelona. In telecom''s API value chain the GSMA is not a network operator and
  not an aggregator; it is the standards and commitment layer. Its GSMA Open Gateway initiative is the memorandum
  of understanding under which 69 operator groups, representing 78% of global mobile connections, commit to
  exposing a common set of network APIs, while the API specifications themselves are authored in the Linux
  Foundation''s CAMARA project. The GSMA''s API posture is unusually open for a standards body: its Open Gateway
  developer portal at open-gateway.gsma.com publishes 17 CAMARA OpenAPI 3.0.3 documents in full, without login,
  alongside a live public deployment map covering 607 launched API instances across 80 operators and 65 countries,
  and it runs a separate, fully open Mobile Money API developer portal with a downloadable OpenAPI 3.0.0 specification,
  SDKs, and use-case guides. The gates are real but narrow: the API sandbox requires a GitHub sign-in, the
  anti-fraud Scam Signal API is held in a private GSMA repository rather than in public CAMARA, and the commercial
  GSMA Services products (Device Check, IMEI Database, PathFinder, Disposable Number Check) are membership
  and contract gated with no public documentation. The GSMA runs no production network API endpoints of its
  own — every Open Gateway API is served by an operator or a channel partner such as Infobip, IPification,
  TMT iD, XConnect, or Singtel.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
