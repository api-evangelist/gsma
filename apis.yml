- aid: gsma:gsma-links-api
  name: GSMA Links API
  description: >-
    The **Links** APIs are used to establish a link between two separate accounts on the client and provider
    systems. The API can be used for example to link a mobile wallet account to a Microfinance Institution
    account or a bank account. The link object does not mandate the processes to verify and authenticate
    a link request - this depends upon the use case. A link needs to be associated with a mode of operation:


    - pull. The link can be used by the client to debit the target account held by the provider.

    - push. The link can be used by the client to credit the target account held by the provider.

    - both. The link can be used for Push and Pull requests.
  humanURL: https://developer.mobilemoneyapi.io/api-versions-1.2/
  baseURL: https://sandbox.mobilemoneyapi.io/simulator/v1.2/passthrough/mm
