apis:
- aid: gsma:gsma-accounts-api
  name: GSMA Accounts API
  description: >-
    The **Accounts** APIs are used to support a range of operations on a financial account resource and
    associated resources.

    Types of accounts include mobile wallets, financial institution accounts and utility accounts (e.g.
    for electricity).


    **Identifying a Target Account**


    Two methods are provided for identifying an account, the single identifier method and the multiple
    identifiers method.


    Single Identifier Method:


    - In the scenario where one identifier suffices to uniquely identify an account, the following path
    is to be used: **/accounts/{identifierType}/{identifier}**.


    Multiple Identifiers Method:


    - Where a single identifier is not sufficient to identify an account, the following path is to be
    used: ' **/accounts/{accountIdentifier1}@{value1}${accountIdentifier2}@{value2}${accountIdentifier3}@{value3}**'.
    The list of permitted account identifiers supported by the Mobile Money API can be found in the API
    documentation. As there can be multiple identifiers required to identify the target account, the path
    uses a '$' delimiter to separate each identifier, up to a limit of three account identifiers.
  humanURL: https://developer.mobilemoneyapi.io/api-versions-1.2/
  baseURL: https://sandbox.mobilemoneyapi.io/simulator/v1.2/passthrough/mm
