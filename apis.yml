- aid: gsma:gsma-open-gateway-call-forwarding-signal
  name: GSMA Open Gateway Call Forwarding Signal API
  description: CAMARA Call Forwarding Signal API as published on the GSMA Open Gateway developer portal.
    Lets an application check whether unconditional or conditional call forwarding is active on a subscriber's
    line, a common indicator of an in-progress scam. Operators expose the endpoints; GSMA publishes the
    specification and documentation. OpenAPI 3.0.3, version 0.2.0, 2 path(s) and 2 operation(s); authorization
    is OpenID Connect (openIdConnect security scheme) with per-operation CAMARA scopes.
  humanURL: https://open-gateway.gsma.com/docs/call-forwarding-signal
