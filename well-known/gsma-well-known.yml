note: >-
  The GSMA operates no production API endpoints of its own, so there is no API host to probe —
  every Open Gateway OpenAPI declares a templated {apiRoot} server variable that the operator or
  aggregator fills in. The hosts below are the GSMA's own corporate and developer-portal hosts.
  Only www.gsma.com publishes a /.well-known/ document (RFC 9116 security.txt). The Open Gateway
  portal returns 404 for the OIDC and OAuth discovery documents because the GSMA issues no tokens:
  authorization always happens against an operator's authorization server.
