aid: gsma
name: GSMA
review:
  question: What is the GSMA's real, publicly reachable API surface, and how much of the
    telecom network-API standard it convenes is open versus member-gated?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  tier: standards-body
  homeMarket: United Kingdom
  sector: Telecommunications
findings:
  summary: |
    The GSMA is the mobile industry's trade association, headquartered in London, and in the
    telecom API value chain it is the standards-and-commitment layer rather than an operator or
    an aggregator. It runs no production network API endpoints of its own. What it does run is
    unusually open for a standards body: the GSMA Open Gateway developer portal at
    open-gateway.gsma.com serves 17 CAMARA OpenAPI 3.0.3 documents in full, anonymously, with no
    login, plus a live public JSON feed of every launched Open Gateway API instance worldwide.
    A second, entirely separate and equally open portal at developer.mobilemoneyapi.io publishes
    the GSMA Mobile Money API specification as a downloadable OpenAPI 3.0.0 document with SDKs
    and use-case guides.

    The gating is real but narrow and specific. The API sandbox is behind a GitHub sign-in. The
    Scam Signal anti-fraud API — named on the GSMA's own API descriptions page and deployed by UK
    and Indian operators — is deliberately held in a private GSMA repository and is not in public
    CAMARA. The commercial GSMA Services catalogue (Device Check, IMEI Database, Device Registry,
    PathFinder, Disposable Number Check, Network Settings Exchange) is contract- and
    membership-gated with no public API documentation at all. The GSMA's own public GitHub
    organisation (github.com/GSMA) contains two repositories, both front-end web utilities, and a
    code search across the org for "openapi" returns zero results — the specifications live on the
    GSMA's own portals and in the Linux Foundation CAMARA org, not in GSMA's GitHub.
  developerPortal:
    primary:
      url: https://open-gateway.gsma.com/
      httpStatus: 200
      confirmed: true
      selfServe: true
      loginWall: false
      note: Real developer portal, not a marketing landing page. Serves /docs (17 API doc pages,
        each with a Swagger API Reference tab that renders a complete embedded OpenAPI document),
        /map (live API deployment map), and /sandbox.
    docs:
      url: https://open-gateway.gsma.com/docs
      httpStatus: 200
      note: Seven categories — Authentication and Fraud Prevention (6), Location Services (3),
        Device Information (3), Communication Quality (2), Payments and Charging (2), Computing
        Services (1), Communication Services (0).
    sandbox:
      url: https://open-gateway.gsma.com/sandbox
      httpStatus: 200
      gated: true
      gate: Sign in with GitHub
      note: Self-serve but account-gated. Portal copy states it supports Client Credentials, CIBA
        (Client Initiated Backchannel Authentication), Authorization Code, and JWT Bearer flows,
        and that it is a pre-production playground before moving to an operator or aggregator.
    secondPortal:
      url: https://developer.mobilemoneyapi.io/
      httpStatus: 200
      confirmed: true
      selfServe: true
      note: Fully separate GSMA Mobile Money API developer portal. Anonymous access to the full
        OpenAPI, API Service Definition, security guidelines, and 5 SDK guides (Java, JavaScript,
        Node.js, PHP, Android). Sign up / Log in exist for the simulator and Postman assets.
    marketingLayer:
      url: https://www.gsma.com/solutions-and-impact/gsma-open-gateway/
      httpStatus: 200
      note: The gsma.com corporate site is the marketing and commitment layer. Its API Descriptions
        page (/gsma-open-gateway-api-descriptions/, HTTP 200) lists the full Open Gateway catalogue
        but points every API description at camaraproject.org rather than hosting a spec.
