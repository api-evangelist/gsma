    harvestMethod: |
      The 17 Open Gateway specifications are not exposed as static .yaml files. Each
      /docs/{api}/api-reference page is a Next.js static export whose __NEXT_DATA__ JSON payload
      carries the complete OpenAPI document verbatim as a YAML string in
      props.pageProps.jsonData. Every one of the 17 was extracted from that payload and saved
      unmodified. All 18 saved documents were re-parsed with PyYAML and confirmed to have an
      openapi key and a non-empty paths object.
    notPublished:
      - Scam Signal — listed on the GSMA Open Gateway API Descriptions page and deployed by UK and
        Indian operators, but by GSMA's own statement it is held in a private GSMA repository and
        is not in public CAMARA. No spec is downloadable.
      - Mobile Money API 1.0 and 1.1 — the version landing pages return 200 but carry no
        Resources sidebar and no Open OAS3 UI page; only 1.2 exposes a downloadable spec.
      - GSMA Services commercial products (Device Check, IMEI Database, Device Registry, Device
        Attribute Data, PathFinder, Disposable Number Check, Network Settings Exchange, eSIM
        Discovery) — contact-us and contract gated, no public API documentation found.
      - GSMA Intelligence data — data.gsmaintelligence.com redirects to a sign-in wall.
  camara:
    posture: Convener and publisher, not an implementer — GSMA hosts the Open Gateway commitment
      layer and republishes 17 CAMARA OpenAPI specs openly, while operators serve the endpoints
    detail: |
      This is not a press release. GSMA Open Gateway is the operator memorandum of understanding
      layer sitting on top of the Linux Foundation CAMARA project, which authors the specifications.
      The GSMA states on its own supporters page that the MoU has been signed by 69 of the world's
      largest network operators, representing 78% of global mobile connections. The GSMA's Open
      Gateway API Descriptions page names the full catalogue and defers every technical description
      to camaraproject.org. The GSMA's own developer portal then goes further than a trade body
      normally would: it publishes 17 complete CAMARA OpenAPI 3.0.3 documents anonymously and runs
      a CAMARA-compliant sandbox. The GSMA itself exposes no CAMARA endpoint in production — every
      instance in its own deployment map belongs to an operator or a channel partner.
    apisWithEvidence:
      - Number Verification
      - SIM Swap
      - Device Swap
      - Device Location Retrieval
      - Device Location Verification
      - Device Reachability Status
      - Device Roaming Status
      - Mobile Device Identifier
      - Know Your Customer Match
      - One Time Password SMS
      - Call Forwarding Signal
      - Carrier Billing
      - Carrier Billing Refund
      - Quality on Demand
      - Home Devices Quality on Demand
      - Population Density Data
      - Simple Edge Discovery
    evidence: Each of the above was harvested as a complete OpenAPI 3.0.3 document from
      open-gateway.gsma.com/docs/{api}/api-reference on 2026-07-25 and saved to openapi/.
    alsoNamedNotHarvested:
      - Scam Signal (private GSMA repository, not public CAMARA)
      - Number Recycling
      - Customer Insights
      - Know Your Customer Age Verification
      - Know Your Customer Fill-In
      - Know Your Customer Tenure
      - Connectivity Insights
      - Connected Network Type
      - Geofencing Subscriptions
      - WebRTC Call Handling / Registration / Event Handling
      - Application Profiles
      - Blockchain Public Access
      - Regional Device Count
      - QoS Profiles / QoS Provisioning
      - Verified Caller
      - Brand Registration
    note: The names above appear on the GSMA API Descriptions page or in the GSMA deployment feed
      but do not have a documentation page with an embedded spec on open-gateway.gsma.com, so
      nothing was harvested for them.
