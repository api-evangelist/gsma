actions:
  apisYmlCreated: true
  apisListed: 18
  openapiHarvested: 18
  readmeCreated: true
  reason: |
    GSMA is a standards body that, unusually for its tier, publishes machine-readable
    specifications openly on two first-party developer portals. All 18 real specifications found
    were saved verbatim with provenance. No endpoint, host, or scope was invented; the templated
    `{apiRoot}` servers were left exactly as GSMA publishes them because GSMA hosts none of them.
