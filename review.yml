  tmForum:
    conformanceCertification: none found for the GSMA itself
    note: The GSMA is not a TM Forum Open API conformance certificate holder — it publishes no
      TMF620/TMF622/TMF641 implementation because it operates no BSS/OSS. TM Forum lists CAMARA as
      an ODA partner at tmforum.org/oda/open-apis/partners/camara (HTTP 403 to automated fetch on
      the review date), reflecting an alignment between the two bodies rather than a GSMA
      conformance claim.
  threeGPPExposure:
    nef: false
    scef: false
    note: The GSMA operates no network and therefore no Network Exposure Function. The CAMARA APIs
      it publishes are the northbound abstraction that operators map onto their own 3GPP NEF/SCEF
      and network-slicing infrastructure. Edge/MEC is represented in the catalogue by the Simple
      Edge Discovery API; 5G quality control by Quality on Demand.
  auth:
    schemes:
      - type: OpenID Connect
        evidence: Every one of the 17 harvested Open Gateway specs declares a single
          `openId` securityScheme of type openIdConnect, with per-operation CAMARA scopes such as
          `number-verification:verify`, `number-verification:device-phone-number:read`, and
          `sim-swap:check`. The openIdConnectUrl in the published specs is the CAMARA placeholder
          https://example.com/.well-known/openid-configuration — the real issuer is the operator's.
      - type: CIBA (Client Initiated Backchannel Authentication)
        present: true
        evidence: Named explicitly in the GSMA sandbox page as one of four supported flows, cited
          in the Number Verification spec narrative as the mechanism for passing a GSMA TS.43
          temporary token via `login_hint=operatortoken:<token>`, and counted in the GSMA's own
          deployment feed — 94 live deployments declare a CIBA auth flow, 57 of them certified.
      - type: OAuth2 Client Credentials
        evidence: 256 deployments in the GSMA feed (49 certified).
      - type: OAuth2 Authorization Code
        evidence: 190 deployments in the GSMA feed (58 certified).
      - type: JWT Bearer
        evidence: 7 deployments in the GSMA feed (1 certified); also described in the Number
          Verification spec for TS.43 token exchange.
    wellKnown:
      - url: https://open-gateway.gsma.com/.well-known/openid-configuration
        httpStatus: 404
      - url: https://open-gateway.gsma.com/.well-known/oauth-authorization-server
        httpStatus: 404
    note: The GSMA issues no tokens. Authorization is always against an operator or aggregator
      authorization server; the sandbox behind GitHub sign-in is the only GSMA-hosted credential
      surface found.
  webhooks:
    present: true
    scope: specification-level only
    detail: Four of the harvested specs (Carrier Billing, Carrier Billing Refund, Population
      Density Data, Quality on Demand) declare a `notificationsBearerAuth` security scheme for
      CloudEvents-style callbacks delivered to a consumer-supplied sink URL. The GSMA itself
      publishes no event catalogue, no AsyncAPI document, and no webhook endpoint of its own.
  sdks:
    firstParty:
      - name: GSMA Mobile Money API SDKs
        languages: [Java, JavaScript, Node.js, PHP, Android]
        url: https://developer.mobilemoneyapi.io/sdks/getting-started/introduction.html
        note: Documented on the Mobile Money developer portal for specification 1.2.0. Package
          registry listings (npm/Maven/PyPI/NuGet) were not confirmed in this review.
    openGateway:
      - none
    note: No first-party GSMA SDK exists for the Open Gateway/CAMARA APIs — GSMA publishes the
      specifications and leaves client tooling to operators, aggregators, and CAMARA.
  graphql:
    present: false
  grpc:
    present: false
  postman:
    publicWorkspace: not found for GSMA
    note: The Mobile Money developer portal describes "authenticated Postmans for each scenario"
      behind its sign-up, not a public Postman workspace.
  mcp:
    present: false
    note: GSMA event material for DTW Ignite 2026 references "the growing role of agentic AI and
      MCP servers in using network APIs" as a discussion topic. No GSMA-published MCP server was
      found.
  github:
    org: https://github.com/GSMA
    publicRepos: 2
    note: Both public repos (selectnav.js, craft-calltoaction) are front-end web utilities, last
      updated 2023 and 2020. A code search across the org for "openapi" returns zero results. The
      specifications GSMA convenes live at github.com/camaraproject under the Linux Foundation,
      not in GSMA's own GitHub. A separate GSMATerminals org publishes eUICC test profiles.
  transports:
    - protocol: REST
      scheme: https
      documented: true
      note: All 18 harvested specifications are HTTPS REST/JSON. The Open Gateway specs declare a
        templated `{apiRoot}` server variable rather than a concrete host, because the GSMA does
        not host the endpoints.
    - protocol: Webhook callbacks
      scheme: https
      documented: true
      note: CloudEvents-style notification sinks in 4 of the 17 Open Gateway specs.
    - protocol: GraphQL
      documented: false
    - protocol: gRPC
      documented: false
    - protocol: WebSocket
      documented: false
  gated: false
  gatedDetail: The two primary developer surfaces (open-gateway.gsma.com/docs and
    developer.mobilemoneyapi.io) are anonymously readable with complete downloadable specs, so the
    provider is not gated at the documentation layer. The gates that do exist are the sandbox
    GitHub sign-in, the private Scam Signal repository, the GSMA Services commercial catalogue, and
    GSMA Intelligence.
