openapi: 3.2.0
info:
  title: Gsma Application API
  x-refined-note:
  - x-api-id differs across the merged source definitions and was not carried
  - x-generation-data-model-version differs across the merged source definitions and was not carried
  - x-generation-date differs across the merged source definitions and was not carried
  - x-generation-tooling-version differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Application across 2 of this provider''s published API definitions: global-system-for-mobile-communications-application-api-openapi.yml, open-gateway-application-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: '{apiRoot}/{basePath}'
  variables:
    apiRoot:
      default: http://localhost:443
      description: API root
    basePath:
      default: edge-application-management/vwip
      description: Base path for the Edge Application Management API
- url: '{apiRoot}/openGatewayOperateAPIOnboardingAndOrdering/v5/'
  variables:
    apiRoot:
      default: https://serverRoot/tmf-api/openGatewayOperateAPIOnboardingAndOrdering/v5
      enum:
      - https://serverRoot/tmf-api/openGatewayOperateAPIOnboardingAndOrdering/v5
tags:
- name: Application
  description: Application and Application Instance Lice Cycle Management
paths:
  /apps:
    post:
      security:
      - openId:
        - edge-application-management:apps:write
      tags:
      - Application
      summary: Global System for Mobile Communications Submit application metadata to the Edge…
      description: 'Contains the information about the application to be

        instantiated in the Edge Cloud'
      operationId: submitApp
      parameters:
      - $ref: '#/components/parameters/x-correlator'
      requestBody:
        description: 'The Application Provider request contains mandatory

          criteria (e.g. required CPU, memory, storage, bandwidth) and

          optional parameters.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppManifest'
        required: true
      responses:
        '201':
          description: Application created successfully
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmittedApp'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
              example:
                status: 409
                code: CONFLICT
                message: App already exists
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    get:
      security:
      - openId:
        - edge-application-management:apps:read
      tags:
      - Application
      summary: Global System for Mobile Communications Retrieve a list of existing Applications
      description: 'Get the list of all existing Application definitions from the

        Edge Cloud Provider that the user has permission to view.'
      operationId: getApps
      parameters:
      - $ref: '#/components/parameters/x-correlator'
      responses:
        '200':
          description: List of existing applications
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppManifest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: '{apiRoot}/{basePath}'
      variables:
        apiRoot:
          default: http://localhost:443
          description: API root
        basePath:
          default: edge-application-management/vwip
          description: Base path for the Edge Application Management API
  /apps/{appId}:
    get:
      security:
      - openId:
        - edge-application-management:apps:read
      tags:
      - Application
      summary: Global System for Mobile Communications Retrieve the information of an…
      description: Ask the Edge Cloud Provider the information for a given application
      operationId: getApp
      parameters:
      - $ref: '#/components/parameters/x-correlator'
      - name: appId
        description: 'A globally unique identifier associated with the

          application.

          Edge Cloud Provider generates this identifier when the application

          is submitted.

          '
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AppId'
      responses:
        '200':
          description: Information of Application
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                type: object
                properties:
                  appManifest:
                    $ref: '#/components/schemas/AppManifest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    delete:
      security:
      - openId:
        - edge-application-management:apps:delete
      tags:
      - Application
      summary: Global System for Mobile Communications Delete an Application from an Edge…
      description: Delete all the information and content related to an Application
      operationId: deleteApp
      parameters:
      - $ref: '#/components/parameters/x-correlator'
      - name: appId
        in: path
        description: 'Identificator of the application to be

          deleted provided by the Edge Cloud Provider

          once the submission was successful

          '
        required: true
        schema:
          $ref: '#/components/schemas/AppId'
      responses:
        '202':
          description: Request accepted
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
        '204':
          description: App deleted
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
              example:
                status: 409
                code: CONFLICT
                message: App with a running application instance cannot be deleted
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: '{apiRoot}/{basePath}'
      variables:
        apiRoot:
          default: http://localhost:443
          description: API root
        basePath:
          default: edge-application-management/vwip
          description: Base path for the Edge Application Management API
  /appinstances:
    post:
      security:
      - openId:
        - edge-application-management:instances:write
      tags:
      - Application
      summary: Global System for Mobile Communications Instantiation of an Application
      description: 'Ask the Edge Cloud Platform to instantiate an application to one

        or several Edge Cloud Zones with an Application as an input and an

        Application Instance as the output.'
      operationId: createAppInstance
      parameters:
      - $ref: '#/components/parameters/x-correlator'
      requestBody:
        description: 'The Application ID and the array of Edge Cloud Zones to deploy

          it to.

          '
        content:
          application/json:
            schema:
              type: object
              required:
              - appId
              - appZones
              properties:
                appId:
                  $ref: '#/components/schemas/AppId'
                appZones:
                  $ref: '#/components/schemas/AppZones'
        required: true
      responses:
        '202':
          description: Application instantiation accepted
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: Contains the URI of the newly created application.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  appInstances:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppInstanceInfo'
                minItems: 1
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
              example:
                status: 409
                code: CONFLICT
                message: Application already instantiated in the given Edge Cloud Zone or Edge Cloud Region
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    get:
      security:
      - openId:
        - edge-application-management:instances:read
      tags:
      - Application
      summary: Global System for Mobile Communications Retrieve the information of Application…
      description: 'Ask the Edge Cloud Provider the information of the instances for a

        given application'
      operationId: getAppInstance
      parameters:
      - $ref: '#/components/parameters/x-correlator'
      - name: appId
        description: 'A globally unique identifier associated with

          the application.

          Edge Cloud Provider generates this identifier when the

          application is submitted.

          '
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AppId'
      - name: appInstanceId
        description: 'A globally unique identifier associated with a running

          instance of an application within an specific Edge Cloud Zone.

          Edge Cloud Provider generates this identifier.

          '
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AppInstanceId'
      - name: region
        description: 'Human readable name of the geographical Edge Cloud Region of

          the Edge Cloud. Defined by the Edge Cloud Provider.

          '
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EdgeCloudRegion'
      responses:
        '200':
          description: Information of Application Instances
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                type: object
                properties:
                  appInstanceInfo:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppInstanceInfo'
                minItems: 1
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: '{apiRoot}/{basePath}'
      variables:
        apiRoot:
          default: http://localhost:443
          description: API root
        basePath:
          default: edge-application-management/vwip
          description: Base path for the Edge Application Management API
  /appinstances/{appInstanceId}:
    delete:
      security:
      - openId:
        - edge-application-management:instances:delete
      tags:
      - Application
      summary: Global System for Mobile Communications Terminate an Application Instance
      description: 'Terminate a running instance of an application within

        an Edge Cloud Zone'
      operationId: deleteAppInstance
      parameters:
      - $ref: '#/components/parameters/x-correlator'
      - name: appInstanceId
        in: path
        description: 'Identificator of the specific application instance

          that will be terminated

          '
        required: true
        schema:
          $ref: '#/components/schemas/AppInstanceId'
      responses:
        '202':
          description: 'Request accepted to be processed. It applies for async

            deletion process

            '
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
        '204':
          description: Application Instance Deleted
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: '{apiRoot}/{basePath}'
      variables:
        apiRoot:
          default: http://localhost:443
          description: API root
        basePath:
          default: edge-application-management/vwip
          description: Base path for the Edge Application Management API
  /application:
    post:
      tags:
      - Application
      summary: Creates a Application
      description: This operation creates a Application entity.
      operationId: createApplication
      parameters:
      - $ref: '#/components/parameters/Fields'
      requestBody:
        $ref: '#/components/requestBodies/Application_FVO'
      responses:
        '201':
          $ref: '#/components/responses/201Application'
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/400_2'
        '401':
          $ref: '#/components/responses/401_2'
        '403':
          $ref: '#/components/responses/403_2'
        '404':
          $ref: '#/components/responses/404_2'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500_2'
        '501':
          $ref: '#/components/responses/501_2'
        '503':
          $ref: '#/components/responses/503_2'
    get:
      tags:
      - Application
      summary: List or find Application objects
      operationId: listApplication
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Before'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          $ref: '#/components/responses/200ApplicationArray'
        '400':
          $ref: '#/components/responses/400_2'
        '401':
          $ref: '#/components/responses/401_2'
        '403':
          $ref: '#/components/responses/403_2'
        '404':
          $ref: '#/components/responses/404_2'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500_2'
        '501':
          $ref: '#/components/responses/501_2'
        '503':
          $ref: '#/components/responses/503_2'
    servers:
    - url: '{apiRoot}/openGatewayOperateAPIOnboardingAndOrdering/v5/'
      variables:
        apiRoot:
          default: https://serverRoot/tmf-api/openGatewayOperateAPIOnboardingAndOrdering/v5
          enum:
          - https://serverRoot/tmf-api/openGatewayOperateAPIOnboardingAndOrdering/v5
  /application/{id}:
    get:
      tags:
      - Application
      summary: Retrieves a Application by ID
      description: This operation retrieves a Application entity. Attribute selection enabled for all first level attributes.
      operationId: retrieveApplication
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          $ref: '#/components/responses/200Application_Get'
        '400':
          $ref: '#/components/responses/400_2'
        '401':
          $ref: '#/components/responses/401_2'
        '403':
          $ref: '#/components/responses/403_2'
        '404':
          $ref: '#/components/responses/404_2'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500_2'
        '501':
          $ref: '#/components/responses/501_2'
        '503':
          $ref: '#/components/responses/503_2'
    patch:
      tags:
      - Application
      summary: Updates partially a Application
      description: This operation updates partially a Application entity.
      operationId: patchApplication
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Fields'
      requestBody:
        $ref: '#/components/requestBodies/Application_MVO'
      responses:
        '200':
          $ref: '#/components/responses/200Application_Patch'
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/400_2'
        '401':
          $ref: '#/components/responses/401_2'
        '403':
          $ref: '#/components/responses/403_2'
        '404':
          $ref: '#/components/responses/404_2'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500_2'
        '501':
          $ref: '#/components/responses/501_2'
        '503':
          $ref: '#/components/responses/503_2'
    servers:
    - url: '{apiRoot}/openGatewayOperateAPIOnboardingAndOrdering/v5/'
      variables:
        apiRoot:
          default: https://serverRoot/tmf-api/openGatewayOperateAPIOnboardingAndOrdering/v5
          enum:
          - https://serverRoot/tmf-api/openGatewayOperateAPIOnboardingAndOrdering/v5
components:
  responses:
    '500':
      description: Internal Server Error
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
          example:
            status: 500
            code: INTERNAL
            message: 'Internal server error: ...'
    '501':
      description: Not Implemented
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
          example:
            status: 501
            code: NOT_IMPLEMENTED
            message: Service not implemented
    '403':
      description: Unauthorized
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
          example:
            status: 403
            code: PERMISSION_DENIED
            message: 'Operation not allowed: ...'
    '401':
      description: Unauthorized
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
          example:
            status: 401
            code: UNAUTHENTICATED
            message: 'Authorization failed: ...'
    '404':
      description: Not Found
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
          example:
            status: 404
            code: NOT_FOUND
            message: Resource does not exist
    '400':
      description: Bad request
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
          example:
            status: 400
            code: INVALID_ARGUMENT
            message: Schema validation failed at  ...
    '503':
      description: Service Unavailable
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
          example:
            status: 503
            code: UNAVAILABLE
            message: Service unavailable
    '500_2':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            basic:
              summary: Internal Server Error example
              value:
                '@type': Error
                code: ERR500
                reason: Internal Server Error
                message: The server encountered an internal error. Please contact the system administrator.
                referenceError: https://host/errors
    '501_2':
      description: Not Implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            basic:
              summary: Not Implemented Error
              value:
                '@type': Error
                code: ERR501
                reason: The requested operation is not implemented
                message: The requested operation is not implemented. Please contact the system administrator.
                referenceError: https://host/errors
    '405':
      description: Method Not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            basic:
              summary: Method Not allowed Error
              value:
                '@type': Error
                code: ERR405
                reason: Method Not allowed
                message: The method is not allowed for the requested URL.
                referenceError: https://host/errors
    200ApplicationArray:
      description: Success
      headers:
        X-Total-Count:
          $ref: '#/components/headers/X-Total-Count'
        X-Result-Count:
          $ref: '#/components/headers/X-Result-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Application_RES'
          examples:
            Retrieve_a_list_of_Application:
              $ref: '#/components/examples/Retrieve_a_list_of_Application_response'
            Retrieve_a_list_of_Application_with_field_selection_and_filter:
              $ref: '#/components/examples/Retrieve_a_list_of_Application_with_field_selection_and_filter_response'
    '403_2':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            basic:
              summary: Forbidden Error
              value:
                '@type': Error
                code: ERR403
                reason: Forbidden
                message: You don't have the permission to access the requested resource. It is either read-protected or not readable by the server.
                referenceError: https://host/errors
    201Application:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Application_RES'
          examples:
            Create_an_Application:
              $ref: '#/components/examples/Create_an_Application_response'
    200Application_Get:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Application_RES'
          examples:
            Retrieve_an_Application_from_its_identifier:
              $ref: '#/components/examples/Retrieve_an_Application_from_its_identifier_response'
            Retrieve_an_Application_with_permissions_from_its_identifier:
              $ref: '#/components/examples/Retrieve_an_Application_with_permissions_from_its_identifier_response'
            Retrieve_an_Application_without_digital_identity_from_its_identifier:
              $ref: '#/components/examples/Retrieve_an_Application_without_digital_identity_from_its_identifier_response'
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            basic:
              summary: Conflict Error
              value:
                '@type': Error
                code: ERR409
                reason: Conflict
                message: The request could not be completed due to a conflict with the current state of the target resource.
                referenceError: https://host/errors
    '401_2':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            basic:
              summary: Unauthorized Error
              value:
                '@type': Error
                code: ERR401
                reason: Unauthorized
                message: You are not authorized to access the requested resource. Please provide the correct credentials.
                referenceError: https://host/errors
    '404_2':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            basic:
              summary: Not Found Error
              value:
                '@type': Error
                code: ERR404
                reason: Not Found
                message: The requested URL was not found on the server.
                referenceError: https://host/errors
    200Application_Patch:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Application_RES'
          examples:
            Update_an_Application_with_json_content_type:
              $ref: '#/components/examples/Update_an_Application_with_json_content_type_response'
            Update_an_Application_with_merge-patch_json_content_type:
              $ref: '#/components/examples/Update_an_Application_with_merge-patch_json_content_type_response'
            Update_an_Application_with_json-patch_json_content_type:
              $ref: '#/components/examples/Update_an_Application_with_json-patch_json_content_type_response'
            Update_an_Application_with_json-patch-query_json_content_type:
              $ref: '#/components/examples/Update_an_Application_with_json-patch-query_json_content_type_response'
    '400_2':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            basic:
              summary: Bad Request Error
              value:
                '@type': Error
                code: ERR400
                reason: Bad Request
                message: The server could not understand the request due to invalid syntax. Please correct the syntax and try again.
                referenceError: https://host/errors
    '503_2':
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            basic:
              summary: Service Unavailable Error
              value:
                '@type': Error
                code: ERR503
                reason: Service Unavailable
                message: The service is currently unavailable. Please try again later.
                referenceError: https://host/errors
  schemas:
    VmResources:
      description: Definition of Virtual Machine Infrastructure
      type: object
      required:
      - infraKind
      - numCPU
      - memory
      properties:
        infraKind:
          description: Type of infrastructure for the application.
          type: string
          example: virtualMachine
          enum:
          - virtualMachine
        numCPU:
          type: integer
          description: 'Number of vcpus in whole (i.e 1)

            '
          example: 1
        memory:
          type: integer
          example: 1024
          description: Memory in mega bytes
        additionalStorages:
          $ref: '#/components/schemas/AdditionalStorage'
        gpu:
          $ref: '#/components/schemas/GpuInfo'
    AppZones:
      description: 'Collection of Edge Cloud Zones and/or Kubernetes cluster reference

        where the Application Provider wants to instantiate the application.

        '
      type: array
      items:
        type: object
        properties:
          kubernetesClusterRef:
            $ref: '#/components/schemas/KubernetesClusterRef'
          EdgeCloudZone:
            $ref: '#/components/schemas/EdgeCloudZone'
      required:
      - EdgeCloudZone
      minItems: 1
      additionalProperties: false
    AppProvider:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
      description: Human readable name of the Application Provider.
    RequiredResources:
      description: 'Fundamental hardware requirements to be provisioned by the

        Application Provider.

        '
      oneOf:
      - $ref: '#/components/schemas/KubernetesResources'
      - $ref: '#/components/schemas/VmResources'
      - $ref: '#/components/schemas/ContainerResources'
      - $ref: '#/components/schemas/DockerComposeResources'
      discriminator:
        propertyName: infraKind
        mapping:
          kubernetes: '#/components/schemas/KubernetesResources'
          virtualMachine: '#/components/schemas/VmResources'
          container: '#/components/schemas/ContainerResources'
          dockerCompose: '#/components/schemas/DockerComposeResources'
    EdgeCloudProvider:
      type: string
      description: Human readable name of the Edge Cloud Provider.
    K8sNetworking:
      description: 'Kubernetes networking definition

        '
      type: object
      properties:
        primaryNetwork:
          description: Definition of Kubernetes primary Network
          type: object
          properties:
            provider:
              description: CNI provider name
              type: string
              example: cilium
            version:
              description: CNI provider version
              type: string
              example: '1.13'
        additionalNetworks:
          description: Additional Networks for the Kubernetes cluster.
          type: array
          items:
            type: object
            description: Additional network interface definition
            properties:
              name:
                description: Additional Network Name
                type: string
                example: net1
              interfaceType:
                description: "Type of additional Interface:\nnetdevice: (SR-IOV) A regular kernel network device in the\n           Network Namespace (netns) of the container\nvfio-pci: (SR-IOV) A PCI network interface directly mounted\n          in the container\ninterface: Additional interface to be used by cni plugins\n           such as macvlan, ipvlan\nNote: The use of SR-IOV interfaces automatically\nconfigure the required kernel parameters for the nodes.\n"
                type: string
                example: vfio-pci
                enum:
                - netdevice
                - vfio-pci
                - interface
    Vcpu:
      type: string
      pattern: ^\d+((\.\d{1,3})|(m))?$
      description: 'Number of vcpus in whole (i.e 1), decimal (i.e 0.500) up to

        millivcpu, or millivcpu (i.e 500m) format.

        '
      example: 500m
    AppInstanceInfo:
      description: Information about the application instance.
      type: object
      properties:
        appInstanceId:
          $ref: '#/components/schemas/AppInstanceId'
        status:
          description: Status of the application instance (default is 'unknown')
          type: string
          enum:
          - ready
          - instantiating
          - failed
          - terminating
          - unknown
          default: unknown
        componentEndpointInfo:
          description: 'Information about the IP and Port exposed by the

            Edge Cloud Platform.

            Application Client shall use these access points to reach this

            application instance

            '
          type: array
          items:
            type: object
            required:
            - interfaceId
            - accessPoints
            properties:
              interfaceId:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9_]{6,30}[A-Za-z0-9]$
                description: 'This is the interface Identifier that Application Provider

                  defines when application is being submitted.

                  '
              accessPoints:
                $ref: '#/components/schemas/AccessEndpoint'
          minItems: 1
        kubernetesClusterRef:
          $ref: '#/components/schemas/KubernetesClusterRef'
        edgeCloudZone:
          $ref: '#/components/schemas/EdgeCloudZone'
    AccessEndpoint:
      type: object
      description: 'Application Endpoint for an especific instance that is

        running in an specific Edge Cloud Zone.

        '
      required:
      - port
      anyOf:
      - required:
        - fqdn
      - required:
        - ipv4Addresses
      - required:
        - ipv6Addresses
      properties:
        port:
          $ref: '#/components/schemas/Port'
        fqdn:
          $ref: '#/components/schemas/Fqdn'
        ipv4Addresses:
          description: IP version 4 of an application instance
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Addr'
          minItems: 1
        ipv6Addresses:
          description: IP version 6 of an application instance.
          type: array
          items:
            $ref: '#/components/schemas/Ipv6Addr'
          minItems: 1
    ErrorInfo:
      type: object
      description: Information about the error
      properties:
        status:
          type: integer
          description: HTTP status code returned along with this error response
        code:
          type: string
          description: Code given to this error
        message:
          type: string
          description: Detailed error description
      required:
      - status
      - code
      - message
    Ipv4Addr:
      type: string
      format: ipv4
      example: 192.168.0.1
      description: 'IP of the device. A single IPv4 address may be specified in

        dotted-quad form 1.2.3.4. Only this exact IP number will match the flow

        control rule.

        '
    Uri:
      type: string
      example: https://charts.bitnami.com/bitnami/helm/example-chart:0.1.0
      description: 'A Uniform Resource Identifier (URI) as per RFC 3986,

        identifies the endpoint within an Edge Cloud Zone where the user

        equipment may connect to the selected application instance

        '
    OperatingSystem:
      description: 'Information about the Operating System of the application image

        '
      type: object
      required:
      - architecture
      - family
      - version
      - license
      properties:
        architecture:
          description: Type of the OS Architecture
          type: string
          enum:
          - x86_64
          - x86
          example: x86_64
        family:
          description: Family to which OS belongs
          type: string
          enum:
          - RHEL
          - UBUNTU
          - COREOS
          - WINDOWS
          - OTHER
        version:
          description: Version of the OS
          type: string
          enum:
          - OS_VERSION_UBUNTU_2204_LTS
          - OS_VERSION_RHEL_8
          - OS_MS_WINDOWS_2022
          - OTHER
        license:
          description: License needed to activate the OS
          type: string
          enum:
          - OS_LICENSE_TYPE_FREE
          - OS_LICENSE_TYPE_ON_DEMAND
          - OTHER
    GpuInfo:
      type: object
      description: Information about the supported GPUs
      required:
      - gpuMemory
      - numGPU
      properties:
        gpuMemory:
          type: integer
          description: GPU memory in mega bytes
        numGPU:
          type: integer
          description: Number of GPUs
    SubmittedApp:
      description: Information about the submitted app
      type: object
      properties:
        appId:
          $ref: '#/components/schemas/AppId'
    Ipv6Addr:
      type: string
      format: ipv6
      example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
      description: 'IP of the device. A single IPv6 address, following IETF 5952

        format, may be specified like 2001:db8:85a3:8d3:1319:8a2e:370:7344

        '
    K8sAddons:
      description: 'Addons for the Kubernetes cluster.

        Additional addons should be defined in application the helm chart

        (Service Mesh, Serverless, AI).

        '
      type: object
      properties:
        monitoring:
          type: boolean
          example: true
          default: false
          description: Enable monitoring for Kubernetes cluster.
        ingress:
          type: boolean
          example: true
          default: false
          description: Enable ingress for Kubernetes cluster.
    EdgeCloudZoneStatus:
      description: Status of the Edge Cloud Zone (default is 'unknown')
      type: string
      enum:
      - active
      - inactive
      - unknown
      default: unknown
    AdditionalStorage:
      description: Additional storage for the application.
      type: array
      items:
        type: object
        required:
        - storageSize
        - mountPoint
        properties:
          name:
            type: string
            description: Name of additional storage resource.
            example: logs
          storageSize:
            type: string
            description: Additional persistent volume for the application.
            example: 80GB
            pattern: ^\d+(GB|MB)$
          mountPoint:
            type: string
            description: Location of additional storage resource.
            example: /logs
    Port:
      type: integer
      description: Port to stablish the connection
      minimum: 0
    AppInstanceId:
      type: string
      format: uuid
      description: 'A globally unique identifier associated with a running

        instance of an application.

        Edge Cloud Platform generates this identifier when the

        instantiation in the Edge Cloud Zone is successful.

        '
    EdgeCloudZoneId:
      type: string
      format: uuid
      description: 'Unique identifier created by the Edge Cloud Platform to identify an

        Edge Cloud Zone within an Edge Cloud.

        '
    DockerComposeResources:
      description: Definition of Docker Compose Infrastructure
      type: object
      required:
      - infraKind
      - numCPU
      - memory
      properties:
        infraKind:
          description: Type of infrastructure for the application.
          type: string
          example: dockerCompose
          enum:
          - dockerCompose
        numCPU:
          type: integer
          description: 'Number of vcpus in whole (i.e 1)

            '
          example: 1
        memory:
          type: integer
          example: 1024
          description: Memory in mega bytes
        storage:
          $ref: '#/components/schemas/AdditionalStorage'
        gpu:
          $ref: '#/components/schemas/GpuInfo'
    EdgeCloudZone:
      type: object
      description: 'An Edge Cloud Zone, uniquely identified by a

        combination of the value of the Edge Cloud Zone Id object

        and the value of the Edge Cloud Provider

        object. This value is used to identify an Edge Cloud zone

        between Edge Clouds from different Edge Cloud Providers.

        '
      required:
      - edgeCloudZoneId
      - edgeCloudZoneName
      - edgeCloudProvider
      properties:
        edgeCloudZoneId:
          $ref: '#/components/schemas/EdgeCloudZoneId'
        edgeCloudZoneName:
          $ref: '#/components/schemas/EdgeCloudZoneName'
        edgeCloudZoneStatus:
          $ref: '#/components/schemas/EdgeCloudZoneStatus'
        edgeCloudProvider:
          $ref: '#/components/schemas/EdgeCloudProvider'
        edgeCloudRegion:
          $ref: '#/components/schemas/EdgeCloudRegion'
      minItems: 1
    KubernetesClusterRef:
      description: 'A global unique identifier associated with a Kubernetes cluster

        infrastructure.

        '
      type: string
      format: uuid
      example: 642f6105-7015-4af1-a4d1-e1ecb8437abc
    EdgeCloudZoneName:
      type: string
      description: 'Human readable name of the geographical zone of

        the Edge Cloud. Defined by the Edge Cloud Provider.

        '
    Fqdn:
      type: string
      description: 'Full qualified domain name of an application instance

        '
    ContainerResources:
      description: Container Infrastructure Definition
      type: object
      required:
      - infraKind
      - numCPU
      - memory
      properties:
        infraKind:
          description: Type of infrastructure for the application.
          type: string
          example: container
          enum:
          - container
        numCPU:
          $ref: '#/components/schemas/Vcpu'
        memory:
          type: integer
          example: 1024
          description: Memory in mega bytes
        storage:
          $ref: '#/components/schemas/AdditionalStorage'
        gpu:
          $ref: '#/components/schemas/GpuInfo'
    AppId:
      type: string
      format: uuid
      description: 'A globally unique identifier associated with the application.

        Edge Cloud Platform generates this identifier when the

        Application is submitted.

        '
    AppManifest:
      description: 'Application information and requirements provided by the

        Application Provider

        '
      properties:
        appId:
          $ref: '#/components/schemas/AppId'
        name:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{1,63}$
          description: Name of the application.
        appProvider:
          $ref: '#/components/schemas/AppProvider'
        version:
          type: string
          description: Application version information
        packageType:
          description: Format of the application image package
          type: string
          enum:
          - QCOW2
          - OVA
          - CONTAINER
          - HELM
        operatingSystem:
          $ref: '#/components/schemas/OperatingSystem'
        appRepo:
          description: 'Repository where Application Provider stores the application image

            '
          type: object
          required:
          - type
          - imagePath
          properties:
            type:
              type: string
              enum:
              - PRIVATEREPO
              - PUBLICREPO
              description: 'Application repository and image URI information.

                PUBLICREPO is used of public urls like github, helm repo etc.

                PRIVATEREPO  is used for private repo managed by the application

                developer. Private repo can be accessed by using the app

                developer provided userName and password. Password is

                recommended to be the personal access token created by developer

                e.g. in Github repo.

                '
            imagePath:
              $ref: '#/components/schemas/Uri'
            userName:
              type: string
              description: 'Username to acces the Helm chart, docker-compose

                file or VM image repository

                '
            credentials:
              type: string
              maxLength: 128
              description: 'Password or personal access token created by

                developer to acces the app repository. API users can generate

                a personal access token e.g. docker clients to use them as

                password.

                '
            authType:
              type: string
              enum:
              - DOCKER
              - HTTP_BASIC
              - HTTP_BEARER
              - NONE
              description: 'The credentials can also be formatted as a Basic

                auth or Bearer auth in HTTP "Authorization" header.

                '
            checksum:
              type: string
              description: 'MD5 checksum for VM and file-based images, sha256

                digest for containers

                '
        requiredResources:
          $ref: '#/components/schemas/RequiredResources'
        componentSpec:
          description: 'Information defined in "appRepo" point to the application

            descriptor e.g. Helm chart, docker-compose yaml file etc.

            The descriptor may contain one or more containers and their

            associated meta-data. A component refers to additional details

            about these containers to expose the instances of the containers

            to external client applications. App provider can define one or

            more components (via the associated network port) in componentSpec

            corresponding to the containers in helm charts or docker-compose

            yaml file as part of app descriptors.

            '
          type: array
          items:
            type: object
            required:
            - componentName
            - networkInterfaces
            properties:
              componentName:
                type: string
                description: Component name must be unique with an application
              networkInterfaces:
                description: 'Each application component exposes some ports

                  either for external users or for inter component

                  communication.

                  Application provider is required to specify which ports are

                  to be exposed and the type of traffic that will flow through

                  these ports.The underlying platform may assign a dynamic port

                  against the "extPort" that the application clients will use

                  to connect with edge application instance.

                  '
                type: array
                items:
                  type: object
                  required:
                  - interfaceId
                  - protocol
                  - port
                  - visibilityType
                  properties:
                    interfaceId:
                      type: string
                      pattern: ^[A-Za-z][A-Za-z0-9_]{3,31}$
                      description: 'Each Port and corresponding traffic protocol

                        exposed by the component is identified by a name.

                        Application client on user device requires this to

                        uniquley idenify the interface.

                        '
                    protocol:
                      type: string
                      enum:
                      - TCP
                      - UDP
                      - ANY
                      description: 'Defines the IP transport communication

                        protocol i.e., TCP, UDP or ANY

                        '
                    port:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
                      description: 'Port number exposed by the component.

                        Edge Cloud Provider may generate a dynamic port

                        towards the component instance which forwards

                        external traffic to the component port.

                        '
                    visibilityType:
                      description: 'Defines whether the interface is exposed

                        to outer world or not i.e., external, or internal.

                        If this is set to "external", then it is  exposed

                        to external applications otherwise it is exposed

                        internally to edge application components within

                        edge cloud. When exposed to external world,

                        an external dynamic port is assigned for UC traffic

                        and mapped to the extPort

                        '
                      type: string
                      enum:
                      - VISIBILITY_EXTERNAL
                      - VISIBILITY_INTERNAL
                minItems: 1
      required:
      - name
      - version
      - appProvider
      - packageType
      - appRepo
      - requiredResources
      - componentSpec
    KubernetesResources:
      description: Definition of Kubernetes Cluster Infrastructure.
      required:
      - infraKind
      - applicationResources
      - isStandalone
      properties:
        infraKind:
          description: Type of infrastructure for the application.
          type: string
          example: kubernetes
          enum:
          - kubernetes
        applicationResources:
          description: 'Application resources define the resources pool required

            by the application to be executed in a Kubernetes clusters.

            '
          type: object
          properties:
            cpuPool:
              required:
              - numCPU
              - memory
              - topology
              type: object
              description: 'CPU Pool refers to the amount of application'' resources

                that is executed in nodes with CPU only. That means the part

                of application that doesn''t require GPU or other kind of

                acceleration.

                CPU pool is not mandatory when the application is executed

                exclusively in a GPU pool.

                A CPU pool is composed by CPU and memory.

                '
              properties:
                numCPU:
                  description: 'Total number of vcpus in whole (i.e 1) of CPU pool.

                    '
                  type: integer
                  example: 1
                memory:
                  description: Total memory in mega bytes of CPU pool.
                  type: integer
                  example: 1024
                topology:
                  type: object
                  description: 'CPU pool topology defines an application''s CPU-based

                    architecture.

                    When deploying for high availability or redundancy, it

                    allows for clustering with a configurable number of nodes

                    and minimum CPU/memory resource per Kubernetes node

                    requirements.

                    '
                  required:
                  - minNumberOfNodes
                  - minNodeCpu
                  - minNodeMemory
                  properties:
                    minNumberOfNodes:
                      description: 'Minimum number of worker nodes required by the

                        application.

                        '
                      type: integer
                      example: 5
                    minNodeCpu:
                      description: 'Minimum number of vcpus in whole (i.e 1) per cluster

                        node in CPU pool.

                        '
                      type: integer
                      example: 2
                    minNodeMemory:
                      description: 'Minimum memory in mega bytes per cluster node in

                        CPU pool.

                        '
                      type: integer
                      example: 1024
            gpuPool:
              required:
              - numCPU
              - memory
              - gpuMemory
              - topology
              type: object
              description: 'GPU Pool refers to the amount of resources of the application

                that is executed in nodes with GPU.

                GPU Pool is not mandatory when the application is executed

                exclusively in a CPU pool.

                A GPU pool is composed by memory, CPU and GPU memory

                '
              properties:
                numCPU:
                  description: 'Total Number of vcpus in whole (i.e 1) of GPU pool.

                    '
                  type: integer
                  example: 1
                memory:
                  description: Total memory in mega bytes of GPU pool.
                  type: integer
                  example: 1024
                gpuMemory:
                  description: Total GPU memory in giga bytes of GPU pool.
                  type: integer
                  example: 16
                topology:
                  type: object
                  description: 'GPU pool topology defines an application''s GPU-based

                    architecture.

                    When deploying for high availability or redundancy, it

                    allows for clustering with a configurable number of nodes

                    and minimum CPU/memory/GPU memory resource per Kubernetes

                    node requirements.

                    '
                  required:
                  - minNumberOfNodes
                  - minNodeCpu
                  - minNodeMemory
                  - minNodeGpuMemory
                  properties:
                    minNumberOfNodes:
                      description: 'Minimum number of worker nodes with GPU required by

                        the application.

                        '
                      type: integer
                      example: 2
                    minNodeCpu:
                      description: 'Minimum number of vcpus in whole (i.e 1) per cluster

                        node in GPU pool.

                        '
                      type: integer
                      example: 2
                    minNodeMemory:
                      description: 'Minimum memory in mega bytes per cluster node in

                        GPU pool.

                        '
                      type: integer
                      example: 1024
                    minNodeGpuMemory:
                      description: Minimum memory in giga bytes per cluster node in GPU pool.
                      type: integer
                      example: 8
        isStandalone:
          description: 'Define if the Kubernetes clusters can be reused by other

            applications.

            '
          type: boolean
          example: false
        version:
          type: string
          description: Minimum Kubernetes Version.
          example: '1.29'
        additionalStorage:
          type: string
          description: 'Amount of persistent storage allocated to the Kubernetes PVC.

            '
          example: 80GB
          pattern: ^\d+(GB|MB)$
        networking:
          $ref: '#/components/schemas/K8sNetworking'
        addons:
          $ref: '#/components/schemas/K8sAddons'
    EdgeCloudRegion:
      type: string
      description: 'Human readable name of the geographical Edge Cloud Region of

        the Edge Cloud. Defined by the Edge Cloud Provider.

        '
    Application:
      allOf:
      - $ref: '#/components/schemas/LogicalResource'
      - type: object
        description: Application is a logical resource that can consume API products. It's a specialization of a LogicalResource in the Open Gateway context.
        properties:
          commercialName:
            type: string
            description: Exact name of the Application as marketed (and known by the end-user).
          logoUrl:
            type: string
            description: Url to retrieve the Application official logo.
          privacyPolicyURL:
            type: string
            description: Url to Application privacy policy, if applicable.
          redirectUrl:
            type: array
            items:
              type: string
            description: After a user successfully authorizes an application, the authorization server will redirect the user back to the application.
          jwksUri:
            type: string
            description: 'Uri pointing to a JSON Web Key (JWK) : data structure that represents a cryptographic key'
          category:
            $ref: '#/components/schemas/ApplicationCategoryType'
          approvalStatus:
            $ref: '#/components/schemas/ApprovalStatusType'
          approvalStatusReason:
            type: string
            description: The reason why the approval state changed. DEPRECATED in the PATCH (bug to be fixed on next major version).
          applicationOwner:
            $ref: '#/components/schemas/PartyRoleRef'
          privacyRightsRequestContact:
            type: array
            items:
              $ref: '#/components/schemas/ContactMedium'
            description: Contact information for the exercise of data protection rights to which the End Users can address. Must be only EmailContactMedium or WebFormContactMedium for this context.
          channelPartner:
            $ref: '#/components/schemas/PartyRoleRef'
          digitalIdentity:
            $ref: '#/components/schemas/ApiDigitalIdentity'
          apiConsumerRole:
            type: array
            items:
              $ref: '#/components/schemas/LogicalResourceRole'
            description: Each GSMA Service-API plays a role, and has specific permissions for use
          creationDate:
            type: string
            format: date-time
            description: Date and time when the Application was created
    ApiDigitalIdentity:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        description: ApiDigitalIdentity is a class that allow to describe a digital identity for an individual or a resource or a specific party role. One of these three MUST be provided. If an individual is provided, this identity will be for all her/his partyRole. To avoid confusion it is recommended in this case to not provide partyRoleIdentified. DEPRECATED in the POST and PATCH, this attribute can't be valued by the API consumer in this context.
        properties:
          clientId:
            type: string
            description: 'OAuth2 Client ID: A public identifier for apps. Even though it is public, it is best that it is not guessable by third parties, so many implementations use something like a 32-character hex string. DEPRECATED in the POST and the PATCH, this attribute can''t be valued by the API consumer in this context.'
          redirectUrl:
            type: array
            deprecated: true
            items:
              type: string
            description: 'DEPRECATED : moved to Application schema. After a user successfully authorizes an application, the authorization server will redirect the user back to the application.'
          jwksUri:
            deprecated: true
            type: string
            description: 'DEPRECATED : moved to Application schema. JSON Web Key (JWK) is a data structure that represents a cryptographic key'
          validFor:
            $ref: '#/components/schemas/TimePeriod'
          status:
            type: string
            description: Used to indicate the current lifecycle status of this digital identity (unknown, active, suspended, archived).
          credential:
            type: array
            description: A list of credential/authentification method that are used for this digital identity.
            items:
              $ref: '#/components/schemas/OAuth2ClientCredential'
      discriminator:
        propertyName: '@type'
        mapping:
          ApiDigitalIdentity: '#/components/schemas/ApiDigitalIdentity'
    LogicalResource_FVO:
      allOf:
      - $ref: '#/components/schemas/Entity'
      - type: object
        description: Logic resource is a type of resource that describes the common set of attributes shared by all concrete logical resources (e.g. TPE, MSISDN, IP Addresses) in the inventory.
        properties:
          description:
            type: string
            description: free-text description of the resource
          name:
            type: string
            description: the name of the resource
          resourceVersion:
            type: string
            description: A field that identifies the specific version of an instance of a resource.
          externalIdentifier:
            type: array
            description: An identification of this resource that is owned by or originates in a software system different from the current system. The structure identifies the system itself, the nature of the resource within the system and the unique ID of the resource within the system. It is anticipated that multiple external IDs can be held for a single resource, e.g. if the resource passed through multiple systems on the way to the current system.
            items:
              $ref: '#/components/schemas/ExternalIdentifier_FVO'
        required:
        - name
      discriminator:
        propertyName: '@type'
        mapping:
          Application: '#/components/schemas/Application_FVO'
          LogicalResource: '#/components/schemas/LogicalResource_FVO'
