components:
  schemas:
    postalAddress:
      type: object
      required:
      - country
      properties:
        addressLine1:
          type: string
          description: First line of the address.
          minLength: 0
          maxLength: 256
        addressLine2:
          type: string
          description: Second line of the address.
          minLength: 0
          maxLength: 256
        addressLine3:
          type: string
          description: Third line of the address.
          minLength: 0
          maxLength: 256
        city:
          type: string
          description: City/Town
          minLength: 0
          maxLength: 256
        stateProvince:
          type: string
          description: State or Province
          minLength: 0
          maxLength: 256
        postalCode:
          type: string
          description: Postal Code
          minLength: 0
          maxLength: 256
        country:
          description: Country"
          allOf:
          - $ref: '#/components/schemas/nationality'
    remittancePurpose:
      type: string
      description: Field providing a description of the reason for the international remittance.
      minLength: 0
      maxLength: 256
    contactPhone:
      type: string
      description: Contact phone number (mobile or landline) of the KYC subject.
      minLength: 0
      maxLength: 256
    geoCode:
      type: string
      description: Indicates the geographic location from where the transaction was initiated.
      minLength: 0
      maxLength: 256
      pattern: ^(-?(90|(\d|[1-8]\d)(\.\d{1,6}){0,1}))\,{1}(-?(180|(\d|\d\d|1[0-7]\d)(\.\d{1,6}){0,1}))$
      example: 37.423825,-122.082900
    requestingLei:
      type: string
      description: Legal Entity Identifier of the organisation that is requesting the transaction.
      minLength: 0
      maxLength: 20
      pattern: ^[A-Z0-9]{4}00[A-Z0-9]{12}\d{2}$
      deprecated: true
    completedCount:
      type: number
      format: int32
      description: Indicates the number of records that have been successful completed.
      minimum: 0
    gender:
      type: string
      enum:
      - m
      - f
      - u
      description: Gender of the KYC subject.
    dateCreated:
      type: string
      format: date-time
      deprecated: true
      description: Date and time when the object was created by the API Provider.
    scheduledStartDate:
      type: string
      format: date-time
      description: If the batch has been scheduled, the expected start time is provided here.
    emailAddress:
      type: string
      description: Email address of the KYC subject.
      minLength: 0
      maxLength: 256
    batchTitle:
      type: string
      description: Client-provided title for the batch.
      minLength: 0
      maxLength: 256
    rejectionCount:
      type: number
      format: int32
      description: Indicates the number of records that have been rejected, either during parsing or during final processing.
      minimum: 0
    completionDate:
      type: string
      format: date-time
      description: Indicates when the batch was completed as recorded by the API.
    responseTransactionType:
      allOf:
      - type: object
        required:
        - amount
        - currency
        - type
        - transactionReference
        - transactionStatus
        properties:
          transactionReference:
            $ref: '#/components/schemas/transactionReference'
          requestingOrganisationTransactionReference:
            $ref: '#/components/schemas/requestingOrganisationTransactionReference'
          originalTransactionReference:
            $ref: '#/components/schemas/originalTransactionReference'
          type:
            $ref: '#/components/schemas/type'
          subType:
            $ref: '#/components/schemas/subType'
          transactionStatus:
            $ref: '#/components/schemas/transactionStatus'
          amount:
            description: The transaction amount.
            allOf:
            - $ref: '#/components/schemas/amount'
            example: '15.23'
          currency:
            description: Currency of the transaction amount.
            allOf:
            - $ref: '#/components/schemas/currency'
            example: RWF
          descriptionText:
            $ref: '#/components/schemas/descriptionText'
          fees:
            $ref: '#/components/schemas/feesArray'
          geoCode:
            $ref: '#/components/schemas/geoCode'
          internationalTransferInformation:
            $ref: '#/components/schemas/internationalTransferInformationResponse'
          oneTimeCode:
            $ref: '#/components/schemas/oneTimeCode'
          recipientKyc:
            $ref: '#/components/schemas/kyc'
          senderKyc:
            $ref: '#/components/schemas/kyc'
          requestingOrganisation:
            $ref: '#/components/schemas/requestingOrganisation'
          servicingIdentity:
            $ref: '#/components/schemas/servicingIdentity'
          transactionReceipt:
            $ref: '#/components/schemas/transactionReceipt'
          creationDate:
            $ref: '#/components/schemas/creationDate'
          modificationDate:
            $ref: '#/components/schemas/modificationDate'
          requestDate:
            $ref: '#/components/schemas/requestDate'
          customData:
            $ref: '#/components/schemas/customDataArray'
          metadata:
            $ref: '#/components/schemas/metadataArray'
          dateCreated:
            $ref: '#/components/schemas/dateCreated'
          dateModified:
            $ref: '#/components/schemas/dateModified'
          receivingLei:
            $ref: '#/components/schemas/receivingLei'
          requestingLei:
            $ref: '#/components/schemas/requestingLei'
      - anyOf:
        - type: object
          required:
          - creditParty
          properties:
            creditParty:
              $ref: '#/components/schemas/creditPartyArray'
        - type: object
          required:
          - debitParty
          properties:
            debitParty:
              $ref: '#/components/schemas/debitPartyArray'
        - type: object
          required:
          - debitParty
          - creditParty
          properties:
            creditParty:
              $ref: '#/components/schemas/creditPartyArray'
            debitParty:
              $ref: '#/components/schemas/debitPartyArray'
    transactionCompletedDate:
      type: string
      format: date-time
      deprecated: true
      description: Date and time indicating when the transaction was completed.
    completedDate:
      type: string
      format: date-time
      deprecated: true
      description: Indicates when the batch was completed as recorded by the API.
    transactionReference:
      type: string
      description: Unique reference for the transaction. This is returned in the response by API provider.
      minLength: 1
      maxLength: 256
    typeReversal:
      type: string
      description: The harmonised Transaction Type.
      enum:
      - adjustment
      - reversal
      example: reversal
    subjectName:
      type: object
      properties:
        title:
          type: string
          description: The given title of the KYC subject, e.g. Mr, Mrs, Dr.
          minLength: 0
          maxLength: 256
        firstName:
          type: string
          description: First name (also referred to as given name) of the KYC subject.
          minLength: 0
          maxLength: 256
        middleName:
          type: string
          description: Middle Name of the KYC subject.
          minLength: 0
          maxLength: 256
        lastName:
          type: string
          description: Surname (also referred to as last or family name) of the KYC subject.
          minLength: 0
          maxLength: 256
        fullName:
          type: string
          description: The full name of the KYC subject.
          minLength: 0
          maxLength: 256
        nativeName:
          type: string
          description: The full name expressed as in the native language.
          minLength: 0
          maxLength: 256
    internationalTransferInformation:
      type: object
      description: A collection of properties detailing information specifically used for international transfers.
      required:
      - originCountry
      properties:
        quotationReference:
          $ref: '#/components/schemas/quotationReference'
        quoteId:
          $ref: '#/components/schemas/quoteId'
        originCountry:
          allOf:
          - $ref: '#/components/schemas/nationality'
          description: The originating country of the transaction, i.e. the country where the transaction was initiated.
        deliveryMethod:
          allOf:
          - $ref: '#/components/schemas/deliveryMethod'
          description: The recipient delivery method as chosen by the sender.
        receivingCountry:
          allOf:
          - $ref: '#/components/schemas/nationality'
          description: Destination Country of the international transfer.
        relationshipSender:
          $ref: '#/components/schemas/relationshipSender'
        remittancePurpose:
          $ref: '#/components/schemas/remittancePurpose'
        sendingServiceProviderCountry:
          allOf:
          - $ref: '#/components/schemas/nationality'
          description: The country of the sending service provider that holds the account of the sender.
    party:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
          description: Provides the account identifier type.
          minLength: 1
          maxLength: 256
          example: msisdn
        value:
          type: string
          description: Provides the account identifier type value.
          minLength: 1
          maxLength: 256
          example: '+33555123456'
    originalTransactionReference:
      type: string
      description: For reversals and refunds, this field indicates the transaction which is the subject of the reversal.
      minLength: 0
      maxLength: 256
    errorObject:
      type: object
      required:
      - errorCategory
      - errorCode
      properties:
        errorCategory:
          type: string
          description: The category grouping for the error.
          enum:
          - businessRule
          - validation
          - authorisation
          - identification
          - internal
          - serviceUnavailable
        errorCode:
          type: string
          description: The harmonised error code identifying the reason for error.
          enum:
          - genericError
          - dailyVolumeLimitExceeded
          - dailyValueLimitExceeded
          - weeklyVolumeLimitExceeded
          - weeklyValueLimitExceeded
          - monthlyVolumeLimitExceeded
          - monthlyValueLimitExceeded
          - accountMaxTotalVolumeExceeded
          - accountMaxTotalValueExceeded
          - lessThanTransactionMinValue
