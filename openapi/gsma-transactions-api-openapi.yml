      - feeAmount
      properties:
        feeType:
          type: string
          description: Defines the type of fee.
          minLength: 1
          maxLength: 256
        feeAmount:
          description: Defines the amount of the fee.
          allOf:
          - $ref: '#/components/schemas/amount'
          example: '5.46'
        feeCurrency:
          description: Defines the currency for the given fee.
          allOf:
          - $ref: '#/components/schemas/currency'
    approvalDate:
      type: string
      format: date-time
      description: Indicates when the batch was approved as recorded by the API.
    senderBlockingReason:
      type: string
      description: The reason for blocking the quotation, based on AML checks on the sender.
      minLength: 0
      maxLength: 256
    descriptionText:
      type: string
      description: Free format text description of the transaction provided by the client. This can be provided as a reference for the receiver on a notification SMS and on an account statement.
      minLength: 0
      maxLength: 160
    requestReversal:
      type: object
      required:
      - type
      properties:
        requestingOrganisationTransactionReference:
          $ref: '#/components/schemas/requestingOrganisationTransactionReference'
        creditParty:
          $ref: '#/components/schemas/creditPartyArray'
        debitParty:
          $ref: '#/components/schemas/debitPartyArray'
        type:
          $ref: '#/components/schemas/typeReversal'
        subType:
          $ref: '#/components/schemas/subType'
        amount:
          description: The transaction amount.
          allOf:
          - $ref: '#/components/schemas/amount'
          example: '15.23'
        currency:
          description: Currency of the transaction amount.
          allOf:
          - $ref: '#/components/schemas/currency'
          example: RWF
        descriptionText:
          $ref: '#/components/schemas/descriptionText'
        fees:
          $ref: '#/components/schemas/feesArray'
        geoCode:
          $ref: '#/components/schemas/geoCode'
        requestingOrganisation:
          $ref: '#/components/schemas/requestingOrganisation'
        servicingIdentity:
          $ref: '#/components/schemas/servicingIdentity'
        requestDate:
          $ref: '#/components/schemas/requestDate'
        customData:
          $ref: '#/components/schemas/customDataArray'
        metadata:
          $ref: '#/components/schemas/metadataArray'
        receivingLei:
          $ref: '#/components/schemas/receivingLei'
        requestingLei:
          $ref: '#/components/schemas/requestingLei'
    amount:
      type: string
      minLength: 1
      maxLength: 23
      pattern: ^([0]|([1-9][0-9]{0,17}))([.][0-9]{0,3}[0-9])?$
      example: '15.21'
    quoteId:
      type: string
      description: The specific quote associated with the quotation.
      minLength: 1
      maxLength: 256
    responseBatchTransactionCompletion:
      type: object
      required:
      - transactionReference
      - creditParty
      - debitParty
      - completionDate
      - link
      properties:
        transactionReference:
          $ref: '#/components/schemas/transactionReference'
        requestingOrganisationTransactionReference:
          $ref: '#/components/schemas/requestingOrganisationTransactionReference'
        creditParty:
          $ref: '#/components/schemas/creditPartyArray'
        debitParty:
          $ref: '#/components/schemas/debitPartyArray'
        completionDate:
          $ref: '#/components/schemas/transactionCompletionDate'
        link:
          $ref: '#/components/schemas/link'
        customData:
          $ref: '#/components/schemas/customDataArray'
        completedDate:
          $ref: '#/components/schemas/transactionCompletedDate'
    metadataArray:
      type: array
      description: A collection of key/value pairs. These can be used to populate additional properties that describe administrative information regarding the resource.
      items:
        $ref: '#/components/schemas/metadata'
      maxItems: 20
    processingFlag:
      type: boolean
      description: Indicates whether the batch is currently undergoing processing by the API Provider.
    requestingOrganisation:
      type: object
      description: An object that details the originating organisation of the request.
      required:
      - requestingOrganisationIdentifierType
      - requestingOrganisationIdentifier
      properties:
        requestingOrganisationIdentifierType:
          type: string
          description: Identifies the identifier type of the requesting organisation.
          enum:
          - lei
          - swiftbic
          - organisationid
        requestingOrganisationIdentifier:
          type: string
          description: Contains the requesting organisation identifier.
          minLength: 1
          maxLength: 256
    rejectionReason:
      type: string
      description: The reason for the transaction request as indicated by the API provider.
      minLength: 1
      maxLength: 256
    deliveryMethod:
      type: string
      enum:
      - directtoaccount
      - agent
      - personaldelivery
    responseReversal:
      type: object
      required:
      - type
      - originalTransactionReference
      - transactionReference
      - transactionStatus
      properties:
        transactionReference:
          $ref: '#/components/schemas/transactionReference'
        requestingOrganisationTransactionReference:
          $ref: '#/components/schemas/requestingOrganisationTransactionReference'
        originalTransactionReference:
          $ref: '#/components/schemas/originalTransactionReference'
        creditParty:
          $ref: '#/components/schemas/debitPartyArray'
        debitParty:
          $ref: '#/components/schemas/debitPartyArray'
        type:
          $ref: '#/components/schemas/typeReversal'
        subType:
          $ref: '#/components/schemas/subType'
        transactionStatus:
          $ref: '#/components/schemas/transactionStatus'
        amount:
          description: The transaction amount.
          allOf:
          - $ref: '#/components/schemas/amount'
          example: '15.23'
        currency:
          description: Currency of the transaction amount.
          allOf:
          - $ref: '#/components/schemas/currency'
          example: RWF
        descriptionText:
          $ref: '#/components/schemas/descriptionText'
        fees:
          $ref: '#/components/schemas/feesArray'
        geoCode:
          $ref: '#/components/schemas/geoCode'
        requestingOrganisation:
          $ref: '#/components/schemas/requestingOrganisation'
        servicingIdentity:
          $ref: '#/components/schemas/servicingIdentity'
        transactionReceipt:
          $ref: '#/components/schemas/transactionReceipt'
        creationDate:
          $ref: '#/components/schemas/creationDate'
        modificationDate:
          $ref: '#/components/schemas/modificationDate'
        requestDate:
          $ref: '#/components/schemas/requestDate'
        customData:
          $ref: '#/components/schemas/customDataArray'
        metadata:
          $ref: '#/components/schemas/metadataArray'
        dateCreated:
          $ref: '#/components/schemas/dateCreated'
        dateModified:
          $ref: '#/components/schemas/dateModified'
        receivingLei:
          $ref: '#/components/schemas/receivingLei'
        requestingLei:
          $ref: '#/components/schemas/requestingLei'
    customDataArray:
      type: array
      description: A collection of key/value pairs. These can be used to populate provider specific fields.
      items:
        $ref: '#/components/schemas/customData'
      maxItems: 20
    servicingIdentity:
      type: string
      description: The field is used to identify the servicing identity for transactions, e.g. till, POS ID, assistant ID.
      minLength: 0
      maxLength: 256
    batchId:
      type: string
      description: Identifier for the Batch that is assigned by the API provider. This ID is used by the client on subsequent GET or PATCH methods.
      minLength: 1
      maxLength: 256
    requestStateObject:
      type: object
      required:
      - notificationMethod
      - serverCorrelationId
      - status
      properties:
        serverCorrelationId:
          type: string
          description: A unique identifier issued by the provider to enable the client to identify the RequestState resource on subsequent polling requests. Must be supplied as a UUID.
          minLength: 1
          maxLength: 256
          pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
        objectReference:
          type: string
          description: Provides a reference to the subject resource, e.g. transaction reference.
          minLength: 0
          maxLength: 256
        status:
          type: string
          enum:
          - pending
          - completed
          - failed
          description: Indicates the status of the request.
        notificationMethod:
          type: string
          enum:
          - callback
          - polling
          description: Indicates whether a callback will be issued or whether the client will need to poll.
        pendingReason:
          type: string
          description: A textual description that can be provided to describe the reason for a pending status.
          minLength: 0
          maxLength: 256
        expiryTime:
          type: string
          format: date-time
          description: Indicate the time by which the provider will fail the request if completion criteria have not been met. For an example, a debit party failing to authorise within the allowed period.
        pollLimit:
          type: number
          format: int32
          description: Indicates the number of poll attempts for the given requeststate resource that will be allowed by the provider.
          exclusiveMinimum: 0
        error:
          description: If the asynchronous processing failed, details of the error will be returned here.
          allOf:
          - $ref: '#/components/schemas/errorObject'
    dateRejected:
      type: string
      format: date-time
      deprecated: true
      description: Date and time of the rejection.
    transactionStatus:
      type: string
      description: Indicates the status of the transaction as stored by the API provider.
      minLength: 1
      maxLength: 256
    oneTimeCode:
      type: string
      description: A one-time code that can be supplied in the request or can be generated in the response depending upon the use case. An authorisation code can be supplied in this field for requests that have been pre-authorised.
      minLength: 0
      maxLength: 256
    creationDate:
      type: string
      format: date-time
      description: Date and time when the object was created by the API Provider.
    kyc:
      type: object
      properties:
        birthCountry:
          description: The country of birth of the KYC subject.
          allOf:
          - $ref: '#/components/schemas/nationality'
        contactPhone:
          $ref: '#/components/schemas/contactPhone'
        dateOfBirth:
          $ref: '#/components/schemas/dateOfBirth'
        emailAddress:
          $ref: '#/components/schemas/emailAddress'
        employerName:
          $ref: '#/components/schemas/employerName'
        gender:
          $ref: '#/components/schemas/gender'
        idDocument:
          $ref: '#/components/schemas/idDocumentArray'
        nationality:
          description: Nationality of the KYC subject.
          allOf:
          - $ref: '#/components/schemas/nationality'
        occupation:
          $ref: '#/components/schemas/occupation'
        postalAddress:
          $ref: '#/components/schemas/postalAddress'
        subjectName:
          $ref: '#/components/schemas/subjectName'
    dateOfBirth:
      type: string
      format: date
      description: Birth date of the KYC subject.
      example: '2000-11-20'
    customData:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
          description: Identifies the type of additional field.
          minLength: 1
          maxLength: 256
        value:
          type: string
          description: Identifies the value of the additional field.
          minLength: 1
          maxLength: 256
  parameters:
    X-Account-Holding-Institution-Identifier-Type:
      name: X-Account-Holding-Institution-Identifier-Type
      in: header
      description: A header variable that identifies the type of the account holding institution. This header is used to support request routing and should be used in conjunction with the X-Account-Holding-Institution-Identifier header.
      required: false
      schema:
        type: string
        enum:
        - lei
        - swiftbic
        - organisationid
    X-Account-Holding-Institution-Identifier:
      name: X-Account-Holding-Institution-Identifier
      in: header
      description: A header variable that identifies the account holding institution. This header is used to support request routing and should be used in conjunction with the X-Account-Holding-Institution-Identifier-Type header.
      required: false
      schema:
        type: string
    X-User-Bearer:
      name: X-User-Bearer
      in: header
      description: Used to pass user’s access token when OAuth 2.0/OIDC authorisation framework is used for end-user authentication.
      required: false
      schema:
        type: string
    transactionTypePath:
      name: transactionType
      in: path
      required: true
      description: Identifies the type of transaction that is to be created.
      schema:
        type: string
        enum:
        - billpay
        - deposit
        - disbursement
        - transfer
        - merchantpay
        - inttransfer
        - adjustment
        - reversal
        - withdrawal
    batchId:
      name: batchId
      in: path
      description: Path variable to uniquely identify the transaction batch.
      required: true
      schema:
        type: string
        maxLength: 256
        minLength: 1
    X-API-Key:
      name: X-API-Key
      in: header
      description: Used to pass pre-shared client's API key to the server.
      required: false
      schema:
        type: string
    fromDateTime:
      name: fromDateTime
      in: query
      description: Indicates the minimum creation date for which records should be returned.
      required: false
      schema:
        type: string
        format: date-time
    X-CorrelationID:
      name: X-CorrelationID
      in: header
      description: Header parameter to uniquely identify the request. Must be supplied as a UUID.
      required: false
      schema:
        type: string
        pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
    offset:
      name: offset
      in: query
      description: Supports pagination. This value will indicate the cursor position from where to retrieve the set of records. For example, a limit of 50 and offset of 10 will return records 11 to 60.
      required: false
      schema:
        type: integer
        format: int32
    X-Content-Hash:
      name: X-Content-Hash
      in: header
      description: SHA-256 hex digest of the request content (encrypted or plain). Applicable only if basic data integrity checking is to be performed.
      required: false
      schema:
        type: string
    X-Date:
      name: X-Date
      in: header
      description: Header parameter to indicate the date and time that the message was originated. It is used for basic message integrity checks, to ensure the request is not stale. Note that the header was previously referenced as 'Date' in version 1.0 of the Mobile Money API.
      required: false
      schema:
        type: string
        format: date-time
    X-User-Credential-1:
      name: X-User-Credential-1
      in: header
      description: The end-users encrypted security credential. Should only be used when OAuth 2.0/OIDC authorisation framework has not been implemented by the API Provider.
      required: false
      schema:
        type: string
    X-Callback-URL:
      name: X-Callback-URL
      in: header
      description: The URL supplied by the client that will be used to return the callback in the form of a HTTP PUT.
      required: false
      schema:
        type: string
        format: uri
    X-Channel:
      name: X-Channel
      in: header
      description: String containing the channel that was used to originate the request. For example USSD, Web, App.
      required: false
      schema:
        type: string
        maxLength: 256
    toDateTime:
      name: toDateTime
      in: query
      description: Indicates the maximum creation date for which records should be returned.
      required: false
      schema:
        type: string
        format: date-time
    transactionReference:
      name: transactionReference
      in: path
      description: Path variable to uniquely identify the transaction.
      required: true
      schema:
        type: string
        maxLength: 256
        minLength: 1
    limit:
      name: limit
      in: query
      description: Supports pagination. If this is not supplied, then the server will apply a limit of 50 records returned for each request.
      required: false
      schema:
        type: integer
        format: int32
    X-Client-Id:
      name: X-Client-Id
      in: header
      description: Used to pass pre-shared client's identifier to the server.
      required: false
      schema:
        type: string
        maxLength: 256
    X-User-Credential-2:
      name: X-User-Credential-2
      in: header
      description: The end-users encrypted security credential Should only be used when OAuth 2.0/OIDC authorisation framework has not been implemented by the API Provider.
      required: false
      schema:
        type: string
  requestBodies:
    requestTransactionType:
      required: true
      description: Represents the request body of a transaction without Type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/requestTransactionType'
    requestReversal:
      required: true
      description: Represents the request body of a transaction reversal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/requestReversal'
    requestBatchTransaction:
      required: true
      description: Represents the request body of a batch of transactions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/requestBatchTransaction'
    updateError:
      required: true
      description: Represents the request body of error callback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorObject'
    requestTransaction:
      required: true
      description: Represents the request body of a transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/requestTransaction'
    genericUpdateSuccess:
      required: true
      description: Represents the request body of a success message callback to an update event.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/genericUpdateSuccess'
    updateTransaction:
      required: true
      description: Represents the request body of transaction callback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/responseTransaction'
    updateReversal:
      required: true
      description: Represents the request body of a reversal callback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/responseReversal'
    updateBatchTransaction:
      required: true
      description: Represents the request body of a batch of transactions callback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/responseBatchTransaction'
    genericPatch:
      required: true
      description: Represents the request body of a batch of generic Patch operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/requestGenericPatchArray'
  headers:
    X-Records-Returned-Count:
      required: false
      description: Integer containing number of records that are returned.
      schema:
        type: integer
        format: int32
    X-Date:
      required: false
      description: The date and time that the response message was sent.
      schema:
        type: string
        format: date-time
    X-Records-Available-Count:
      required: false
      description: Integer containing number of records that are available to be returned.
      schema:
        type: integer
        format: int32
