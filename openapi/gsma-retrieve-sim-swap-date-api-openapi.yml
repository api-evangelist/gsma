openapi: 3.2.0
info:
  title: Retrieve SIM Swap Date API
  description: "The SIM swap API provides a programmable interface for developers and other users (capabilities consumers) to request the last date of a SIM swap performed on the mobile line, or, to check whether a SIM swap has been performed during a past period.\n\n# Introduction\n\nThe SIM Swap API performs real-time checks on the last SIM Swap event.\n\nThe SIM Swap API is useful to prevent fraud by reducing the risk of account takeover fraud by strengthening SIM based authentication processes such as SMS One-time passwords. Fraudsters are using SIM swap techniques to intercept SMS messages and reset passwords or receive verification codes that allow them to access protected accounts.\n\nThe SIM Swap API can also be used to protect non-automated actions. For example, when a call center expert contacts a user to clarify or confirm a sensitive operation.\n\nThis API is used by an application to get information about a mobile line latest SIM swap date. It can be easily integrated and used through this secured API and allows SPs (Service Provider) to get this information an easy & secured way. The API provides management of 2 endpoints answering 2 distinct questions:\n\n* When did the last SIM swap occur?\n* Has a SIM swap occurred during last n hours?\n\n# Relevant terms and definitions\n\n**SIM swap**:\nA SIM swap is a process in which a user's mobile phone number (MSISDN) is associated with a new SIM card (IMSI). This is typically done by contacting the user's mobile service provider and requesting a new SIM card for various reasons, such as a lost or damaged SIM card or upgrading to a new phone.\n\nSIM swap also happens during other actions like changing user's phone number, changing mobile service provider keeping user's mobile phone number or when activating a new SIM associated to the same phone number, known as multisim service. New subscription is considered as a SIM swap as well, the MSISDN which can be used by another person earlier, is associated with a SIM card it was not associated before.\n\n# API functionality\n\nThe API provides 2 operations:\n\n- POST retrieve-date : Provides timestamp of latest SIM swap, if any, for a given phone number.\n\n  - If no swap has been performed and the network operator supports unlimited SimSwap monitoring timeframe, the API will return the SIM activation date (the timestamp of the first time that the SIM connected to the network).\n\n  - If the latest SIM swap date (or the activation date if no SIM swap) cannot be communicated due to local regulations (or MNO internal privacy policies) preventing the safekeeping of the information for longer than the stated period, a `null` value will be returned. Optionally, a `monitoredPeriod` could be provided to indicate monitored time frame (in days) supported by the MNO. In this case the response must be treated as \"there were no sim swap events during 'monitoredPeriod'. Either the parameter is optional, it is recommended to support it in SimSwap implementations.\n\n- POST check: Checks if SIM swap has been performed during a past period (defined in the request with 'maxAge' attribute) for a given phone number.\n\n  - Note: In the specification of the API the 'maxAge' could be between 1 hour to 2400 hours. If this delay is not managed due to the operator's own privacy threshold (which in theory would likely be linked to local regulations in the country) and a request is performed with a value inferior to 2400 but superior to operator policy, then,  an error `400 OUT_OF_RANGE `is expected with an explicit message to explain the limitation like `Check monitor period could not exceed local regulations (30 days)`.\n\n<!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->\n# Authorization and authentication\n\nThe \"Camara Security and Interoperability Profile\" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.\n\nThe specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.\n\nIn cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.\n<!-- CAMARA:MANDATORY:authorization-and-authentication:END -->\n\n# Identifying the phone number from the access token\n\nThis API requires the API consumer to identify a phone number as the subject of the API. There is 2 ways to retrieve it depending on the authorization flow used:\n- When the API is invoked using a two-legged access token, the phone number will be identified from the optional `phoneNumber` identifier, which therefore MUST be provided.\n- When a three-legged access token is used however, this optional `phoneNumber` identifier MUST NOT be provided, as the phone number will be uniquely identified from the access token.\n\nThis approach simplifies API usage for API consumers using a three-legged access token to invoke the API by relying on the information that is associated with the access token and was identified during the authentication process.\n\n## Error handling:\n\n- If the phoneNumber cannot be identified from the access token and the optional `phoneNumber` identifier is not included in the request, then the server will return an error with the `422 MISSING_IDENTIFIER` error code.\n\n- If the phoneNumber can be identified from the access token and the optional `phoneNumber` identifier is also included in the request, then the server will return an error with the `422 UNNECESSARY_IDENTIFIER` error code. This will be the case even if the same device is identified by these two methods, as the server is unable to make this comparison.\n\n<!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->\n# Additional CAMARA error responses\n\n  The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.\n\n  Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified in the `API Readiness Checklist` document associated to this API version.\n\n  As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.\n<!-- CAMARA:MANDATORY:additional-error-responses:END -->\n\n<!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->\n# Request body strictness\n\nThis API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.\n<!-- CAMARA:MANDATORY:request-body-strictness:END -->\n\n# Further info and support\n\n[GSMA Mobile Connect Account Takeover Protection specification](https://www.gsma.com/identity/wp-content/uploads/2022/12/IDY.24-Mobile-Connect-Account-Takeover-Protection-Definition-and-Technical-Requirements-v2.0.pdf) was used as source of input for this API. For more about Mobile Connect, please see [Mobile Connect website](https://mobileconnect.io/).\n\n(FAQs will be added in a later version of the documentation)\n"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: wip
  x-camara-commonalities: 0.6
servers:
- url: '{apiRoot}/sim-swap/vwip'
  variables:
    apiRoot:
      default: http://localhost:9091
      description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
- name: Retrieve SIM Swap Date
  description: operation to retrieve latest SIM swap change date
paths:
  /retrieve-date:
    post:
      security:
      - openId:
        - sim-swap:retrieve-date
      - openId:
        - sim-swap
      tags:
      - Retrieve SIM Swap Date
      summary: Retrieve SIM swap date
      description: Get timestamp of last SIM swap event for a mobile user account provided with phone number.
      operationId: retrieveSimSwapDate
      parameters:
      - $ref: ../common/CAMARA_common.yaml#/components/parameters/x-correlator
      requestBody:
        description: 'Create a SIM swap date request for a phone number.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSimSwapDate'
            examples:
              RETRIEVE_3LEGS:
                $ref: '#/components/examples/RETRIEVE_3LEGS'
              RETRIEVE_2LEGS:
                $ref: '#/components/examples/RETRIEVE_2LEGS'
        required: true
      responses:
        '200':
          description: Contains information about SIM swap change
          headers:
            x-correlator:
              $ref: ../common/CAMARA_common.yaml#/components/parameters/x-correlator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimSwapInfo'
              examples:
                RETRIEVE_DATE:
                  $ref: '#/components/examples/RETRIEVE_DATE'
                RETRIEVE_MONITORED_PERIOD:
                  $ref: '#/components/examples/RETRIEVE_MONITORED_PERIOD'
                RETRIEVE_MONITORED_NULL:
                  $ref: '#/components/examples/RETRIEVE_MONITORED_NULL'
        '400':
          $ref: ../common/CAMARA_common.yaml#/components/responses/Generic400
        '401':
          $ref: ../common/CAMARA_common.yaml#/components/responses/Generic401
        '403':
          $ref: ../common/CAMARA_common.yaml#/components/responses/Generic403
        '404':
          $ref: ../common/CAMARA_common.yaml#/components/responses/Generic404
        '422':
          $ref: ../common/CAMARA_common.yaml#/components/responses/Generic422
        '429':
          $ref: ../common/CAMARA_common.yaml#/components/responses/Generic429
components:
  examples:
    RETRIEVE_3LEGS:
      summary: Retrieve request with 3-legged access tokens
      description: Retrieve request with 3-legged access tokens
      value: {}
    RETRIEVE_DATE:
      summary: Lastest SIM swap date is send back
      description: Lastest SIM swap date is send back
      value:
        latestSimChange: 2024-09-18 07:37:53.471829+00:00
    RETRIEVE_MONITORED_PERIOD:
      summary: null is send back for the date but a monitoredPeriod is provided
      description: As latest sim swap date is too long ago, null value is sent back with a monitored period
      value:
        latestSimChange: null
        monitoredPeriod: 120
    RETRIEVE_MONITORED_NULL:
      summary: Only null value is retrieved
      description: As latest sim swap date is too long ago, null value is sent back
      value:
        latestSimChange: null
    RETRIEVE_2LEGS:
      summary: Retrieve request without 3-legged access tokens
      description: Retrieve request in 2-legs (with phoneNumber in the request body)
      value:
        phoneNumber: '+346661113334'
  schemas:
    CreateSimSwapDate:
      type: object
      description: Definition of the data that must be provided in the request body for retrieve-date operation
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
    PhoneNumber:
      $ref: ../common/CAMARA_common.yaml#/components/schemas/PhoneNumber
    SimSwapInfo:
      type: object
      description: Definition of the data that can be returned in the response body for retrieve-date operation
      required:
      - latestSimChange
      properties:
        latestSimChange:
          type:
          - string
          - 'null'
          format: date-time
          maxLength: 64
          description: Timestamp of latest SIM swap performed. It must follow [RFC 3339 (https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
        monitoredPeriod:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
          description: Timeframe in days for SIM card change supervision for the phone number. It could be valued in the response if the latest SIM swap occurred before this monitored period.
          example: 120
  securitySchemes:
    openId:
      $ref: ../common/CAMARA_common.yaml#/components/securitySchemes/openId
externalDocs:
  description: Product documentation at Camara
  url: https://github.com/camaraproject/SimSwap
